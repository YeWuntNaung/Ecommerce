name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: .NET build and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.401'
          cache: true
          cache-dependency-path: Directory.Packages.props

      - name: Restore tools
        run: dotnet tool restore

      - name: Build
        run: dotnet build Ecommerce.slnx --configuration Release

      - name: Test
        # Integration tests start Postgres with Testcontainers; Docker is
        # available on the GitHub-hosted Ubuntu runner.
        run: dotnet test Ecommerce.slnx --configuration Release --no-build

  frontend:
    name: Angular build and tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      - name: Test
        run: npm test
        env:
          CI: true
